[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "ftalgo"
version = "0.1.0"
description = "Quantum algorithms on a simulated fault-tolerant quantum computer: logical error channels measured by circuit-level simulation, algorithms compiled to Clifford+T+Toffoli and run end to end."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jasper Sands" }]
keywords = ["fault tolerance", "surface code", "lattice surgery", "resource estimation", "shor", "phase estimation", "quantum chemistry"]
dependencies = ["numpy>=1.22"]

[project.urls]
Homepage = "https://ft.jaspersands.com"
Repository = "https://github.com/Jaspersands/ft-algorithms"
Report = "https://ft.jaspersands.com/report/report.html"

[project.optional-dependencies]
calibrate = ["stabilizer-qec>=1.2"]
synth = ["pygridsynth>=2.0", "mpmath"]
test = ["pytest", "hypothesis", "qiskit>=1.0", "qiskit-aer", "pyscf", "stim", "pymatching"]

[tool.maturin]
python-source = "python"
module-name = "ftalgo._ftsim"
features = ["python"]
profile = "python"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long statistical checks"]
