# Wheels for PyPI, built on a version tag (v*) or by hand.
#
# Building and the smoke test run anywhere. Publishing runs only on a tag, by PyPI's trusted
# publishing: the PyPI project ftalgo trusts this repository's workflow "wheels.yml" in
# environment "pypi". After publishing, the job creates the GitHub Release for the tag, with the
# wheels attached; Zenodo archives each release and gives it a DOI.
name: Wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # One abi3 wheel per platform serves every CPython from 3.9. Each build first copies the fitted
  # model and the rotation cache into the package (tools/bundle_data.sh): an installed ftalgo has
  # no data/ directory.
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
        libc: [auto, musllinux_1_2]
    steps:
      - uses: actions/checkout@v5
      - run: sh tools/bundle_data.sh
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --out dist
          manylinux: ${{ matrix.libc == 'auto' && matrix.target == 'aarch64' && '2_28' || matrix.libc }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.libc }}
          path: dist

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh tools/bundle_data.sh
      - uses: PyO3/maturin-action@v1
        with:
          target: universal2-apple-darwin
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh tools/bundle_data.sh
        shell: bash
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: x64
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-x64
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh tools/bundle_data.sh
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  # The installed wheel, away from the repository, on each operating system.
  smoke:
    needs: [linux, macos, windows]
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: wheels-linux-x86_64-auto
          - runner: macos-latest
            artifact: wheels-macos
          - runner: windows-latest
            artifact: wheels-windows-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Install the wheel and run the smoke test outside the repository
        shell: bash
        run: |
          python -m pip install dist/*.whl
          mkdir -p "$RUNNER_TEMP/smoke" && cp tools/smoke_installed.py "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke" && python -I smoke_installed.py

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, macos, windows, sdist, smoke]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*"
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
